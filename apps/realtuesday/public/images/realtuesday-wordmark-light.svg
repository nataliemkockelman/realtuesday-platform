<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="real Tuesday">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Fraunces:ital,opsz,wght@1,9..144,600&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
      .real { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:120px; }
      .tues { font-family:'Fraunces',serif; font-style:italic; font-weight:600; font-size:132px; }
      .est  { font-family:'JetBrains Mono',monospace; font-weight:500; font-size:15px; letter-spacing:5px; }
    </style>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0%"  stop-color="#A8531F"/>
      <stop offset="28%" stop-color="#C97B3E"/>
      <stop offset="54%" stop-color="#F5D18F"/>
      <stop offset="78%" stop-color="#C97B3E"/>
      <stop offset="100%" stop-color="#A8531F"/>
    </linearGradient>
  </defs>
  <text class="real" x="320" y="152" text-anchor="middle" fill="#1A2238">real</text>
  <text class="tues" x="320" y="290" text-anchor="middle" fill="url(#foil)">Tuesday</text>
  <rect x="290" y="312" width="60" height="4" rx="2" fill="#C97B3E"/>
  <text class="est" x="320" y="350" text-anchor="middle" fill="#A8531F">EST · SIOUX FALLS</text>
</svg>
